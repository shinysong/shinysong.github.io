theme: jekyll-theme-chirpy
lang: ko-KR
timezone: Etc/UTC
title: Shiny Song
tagline: 지식 그래프와 인공지능 연구 노트
description: 지식 그래프, GraphRAG, SHACL과 관련 연구를 기록하는 개인 블로그
url: https://shinysong.github.io
baseurl: ""
github:
  username: shinysong
social:
  name: Shiny Song
  links:
    - https://github.com/shinysong
avatar: /assets/img/lab-mark.svg
theme_mode:
toc: true
future: true
paginate: 8
comments:
  provider:
analytics: {}
assets:
  self_host:
    enabled: false
pwa:
  enabled: false
  cache:
    enabled: false
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      math: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      toc: true
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

permalink: /posts/:title/
